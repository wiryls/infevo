[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "information-evolution"
version = "0.2.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "openai>=2.37.0",
    "rtoml>=0.13.0",
]

[project.scripts]
self = "self:main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.409",
    "ruff",
]

[tool.hatch.build.targets.wheel]
only-include = ["self.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
